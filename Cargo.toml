[workspace]
members = [
  "crates/pi-whim-app",
  "crates/pi-whim-agent-team",
  "crates/pi-whim-catalog",
  "crates/pi-whim-core",
  "crates/pi-whim-engine",
  "crates/pi-whim-gpui",
  "crates/pi-whim-persistence",
  "crates/pi-whim-pi-rpc",
  "crates/pi-whim-runtime",
  "crates/pi-whim-theme",
  "crates/pi-whim-tool-protocol",
  "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Pi-Whim contributors"]
repository = "https://github.com/pi-whim/pi-whim"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
crossbeam-channel = "0.5"
dirs = "6.0"
# gpui-component declares `gpui = { git = ".../zed" }` with no rev, so pinning one
# here would resolve a second, incompatible gpui. Both follow zed main, and
# Cargo.lock is what makes the build reproducible.
gpui = { git = "https://github.com/zed-industries/zed" }
# font-kit is what enables real font loading on macOS; without it every family
# resolves to the same empty FontId and text renders as nothing at all.
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
  "font-kit",
  "runtime_shaders",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "bc174a7ec4534b2a4174fddde314b38d30d69093" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "bc174a7ec4534b2a4174fddde314b38d30d69093" }
keyring = { version = "3.6", features = ["apple-native"] }
libc = "0.2"
parking_lot = "0.12"
rusqlite = { version = "0.35", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.1", features = ["json"] }
thiserror = "2.0"
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
unicode-segmentation = "1.12"
url = "2.5"
uuid = { version = "1.15", features = ["v4", "v5", "serde"] }
walkdir = "2.5"


[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

# The UI framework is what draws every frame but is not what we debug, so build
# it optimized even in dev. Without this, debug builds render sluggishly.
[profile.dev.package]
gpui = { opt-level = 3 }
gpui_macos = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
gpui-component = { opt-level = 3 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
